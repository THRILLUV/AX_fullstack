<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>절편</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; margin: 24px; color: #222; }
    h1 { font-size: 20px; font-weight: 600; }
    p { color: #444; }
  </style>
</head>
<body>
  <h1>요금 = 거리 × 2000 + 1000</h1>
  <p>거리 0km일 때 세로축에 닿는 1000원이 절편입니다. 1km마다 2000원 오르는 칸이 기울기입니다.</p>
  <svg viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="거리 0에서 요금 1000원인 절편">
    <line x1="70" y1="40" x2="70" y2="360" stroke="#888" />
    <line x1="70" y1="360" x2="600" y2="360" stroke="#888" />
    <text x="300" y="400" font-size="14">거리 (km)</text>
    <text x="16" y="200" font-size="14" transform="rotate(-90 16 200)">요금 (원)</text>
    <text x="40" y="364" font-size="13">0</text>
    <text x="210" y="384" font-size="13">1</text>
    <text x="360" y="384" font-size="13">2</text>
    <text x="510" y="384" font-size="13">3</text>
    <text x="28" y="334" font-size="13">1000</text>
    <text x="28" y="244" font-size="13">3000</text>
    <text x="28" y="154" font-size="13">5000</text>
    <text x="28" y="64" font-size="13">7000</text>
    <!-- 점: (0,1000) (1,3000) (2,5000) (3,7000) -->
    <polyline points="70,330 220,240 370,150 520,60" fill="none" stroke="#e07a2f" stroke-width="3" />
    <circle cx="70" cy="330" r="6" fill="#e07a2f" />
    <circle cx="220" cy="240" r="6" fill="#e07a2f" />
    <circle cx="370" cy="150" r="6" fill="#e07a2f" />
    <circle cx="520" cy="60" r="6" fill="#e07a2f" />
    <line x1="70" y1="330" x2="220" y2="330" stroke="#666" stroke-dasharray="5 4" />
    <line x1="220" y1="330" x2="220" y2="240" stroke="#666" stroke-dasharray="5 4" />
    <text x="88" y="318" font-size="14" font-weight="600">절편 1000원</text>
    <text x="232" y="300" font-size="14">기울기 +2000원</text>
  </svg>
</body>
</html>
